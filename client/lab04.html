<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Flight LAB 04</title>
<style>
body{background:#080f1b;color:#e3f3ff;font:16px system-ui;margin:24px}
main{max-width:1000px;margin:auto}
a{color:#63e8ff}
button,input,select{padding:10px;margin:5px;background:#164c68;color:white;border:1px solid #34516b;border-radius:6px}
button{cursor:pointer}
.panel{border:1px solid #34516b;border-radius:12px;padding:20px;margin-top:20px;background:#0b1524}
#messages{height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
#status{color:#63e8ff}
</style>
</head>
<body>
<main>
<h1>SPACE FLIGHT / LAB 04</h1>
<nav>
<a href="/">LAB 01</a> ·
<a href="/lab02.html">LAB 02</a> ·
<a href="/lab03.html">LAB 03</a> ·
<a href="/lab05.html">LAB 05</a>
</nav>

<section class="panel">
<h2>WebSocket Lobby</h2>
<p id="status">Відключено</p>
<input id="name" placeholder="Ім'я гравця" maxlength="30">
<input id="room" placeholder="Назва кімнати" value="Alpha" maxlength="30">
<button id="join">Join</button>
<button id="leave">Leave</button>
<button id="refresh">Оновити кімнати</button>
<h3>Доступні кімнати</h3>
<div id="rooms"></div>
<h3>Гравці</h3>
<div id="players"></div>
</section>

<section class="panel">
<h2>Чат кімнати</h2>
<div id="messages"></div>
<form id="chat">
<input id="text" placeholder="Введіть повідомлення" maxlength="500" required>
<button>Надіслати</button>
</form>
</section>
</main>
<script type="module" src="/src/lab4/main.js"></script>
</body>
</html>
